<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Тест екрана ZAL</title>
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Тест екрана">
<meta name="robots" content="noindex">
<link rel="manifest" href="diag.webmanifest">
<script>
/* Runs before first paint: picks the fix variant from ?fix=N (0..3, default 1),
   marks <html data-fix data-bar>, and for fix 3 sets html.style.minHeight from
   the screen size (never from innerHeight: that would oscillate). */
(function () {
  "use strict";
  var fix = "1";
  try {
    var q = new URLSearchParams(location.search).get("fix");
    if (q === "0" || q === "1" || q === "2" || q === "3") fix = q;
  } catch (e) {}
  document.documentElement.setAttribute("data-fix", fix);
  document.documentElement.setAttribute("data-bar", "1");

  function applyFix3() {
    if (fix !== "3" || navigator.standalone !== true) return;
    var portrait = true;
    try { portrait = window.matchMedia ? window.matchMedia("(orientation: portrait)").matches : true; } catch (e) {}
    var S = portrait ? Math.max(screen.width, screen.height) : Math.min(screen.width, screen.height);
    document.documentElement.style.minHeight = S + "px";
  }

  window.__diagFix = fix;
  window.__diagApplyFix3 = applyFix3;
  applyFix3();
})();
</script>
<style>
/* ============ Base (mirrors the app) ============ */
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
/* On purpose, unlike the app: keeps text size after a rotation */
html{-webkit-text-size-adjust:100%; text-size-adjust:100%;}
html,body{height:100%;}
body{
  margin:0; background:#000; color:#ddd;
  font:11px/1.3 ui-monospace, Menlo, Monaco, monospace;
  overscroll-behavior-y:none;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
button{font:inherit; color:inherit; touch-action:manipulation;}
input{-webkit-user-select:text; user-select:text;}

/* ============ Fix variants (standalone only; fix 0 has no rule) ============ */
@media (display-mode: standalone) { html[data-fix="1"] { min-height: min(100lvh, calc(100% + env(safe-area-inset-top))); } }
@media (display-mode: standalone) { html[data-fix="2"] { min-height: 100lvh; } }

/* Root: fixed, column; the bottom padding always clears the largest tab bar variant */
#root{
  position:fixed; inset:0; display:flex; flex-direction:column;
  padding-top:env(safe-area-inset-top);
  padding-bottom:calc(56px + env(safe-area-inset-bottom) + 12px);
  overflow:hidden;
}

/* ============ Fix links, bar control, hint, table, controls, log ============ */
.row{display:flex; gap:4px; padding:4px 6px; align-items:center;}
.row .lbl{color:#8ab; padding:0 2px; white-space:nowrap;}
.pill{
  display:inline-flex; align-items:center; justify-content:center;
  min-height:44px; height:44px; padding:0 8px; min-width:0;
  font:bold 13px/1 system-ui, -apple-system, sans-serif;
  background:#1F1F23; color:#ddd; border:0; border-radius:6px; text-decoration:none;
  touch-action:manipulation; white-space:nowrap;
}
.pill.active{background:#B14BFF; color:#16002B;}
.pill.go{background:#2a6ad0; color:#fff;}
#fixRow a{flex:1 1 0;}
#fixRow button{flex:0 0 auto;}
#barRow .pill{flex:0 0 auto; min-width:44px;}
.hint{padding:4px 6px; color:#9bd; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
table{border-collapse:collapse; width:100%; table-layout:fixed;}
td{padding:1px 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.3;}
td.k{width:52px; color:#8ab;}
/* The html row may hold a long computed min-height: let it wrap at 320 px instead of hiding the tail */
tr.wrap td{white-space:normal; overflow-wrap:anywhere;}
.ctl{display:flex; gap:4px; padding:4px 6px; align-items:center;}
.ctl input{
  flex:1 1 56px; min-width:0; height:44px; font-size:17px; padding:0 8px;
  background:#111; color:#eee; border:1px solid #444; border-radius:6px;
}
.ctl button{
  flex:0 0 auto; height:44px; min-height:44px; padding:0 8px;
  font:bold 13px/1 system-ui, -apple-system, sans-serif;
  background:#2a6ad0; color:#fff; border:0; border-radius:6px;
}
#copyMsg{flex:0 1 auto; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:#9bd;}
#log{flex:1 1 auto; min-height:0; overflow-y:auto; padding:2px 6px; color:#aaa;}
#log div{overflow-wrap:anywhere; padding:1px 0; border-top:1px solid #222;}
#log div:first-child{border-top:0; color:#ddd;}

/* ============ Hidden probes: never intercept taps, never scroll ============ */
.probe{position:fixed; left:0; top:0; width:0; visibility:hidden; pointer-events:none;}
#p-vh{height:100vh;}
/* height: 0 first, so an unsupported unit reads 0 (a valid measurement) */
#p-dvh{height:0; height:100dvh;}
#p-svh{height:0; height:100svh;}
#p-lvh{height:0; height:100lvh;}
#p-fixed{position:fixed; inset:0; visibility:hidden; pointer-events:none;}
#p-env{
  position:fixed; left:0; top:0; width:0; height:0; visibility:hidden; pointer-events:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ============ Marker: 3 px line on the physical bottom edge, above the tab bar ============ */
#marker{position: fixed; left: 0; right: 0; bottom: 0; height: 3px; background: #B14BFF; z-index: 40; pointer-events: none;}

/* ============ Tab bar mock (copied from style.css with tokens resolved) ============ */
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; background:#000000; border-top:1px solid #2A2A2F;}
.tab-btn{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; min-height:44px; padding:0; border:0; background:none; color:#8E8E93; font:600 12px/1.3 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; touch-action:manipulation;}
.tab-btn.active{color:#D29BFF;}
.tab-btn.active .ic{color:#B14BFF;}
.ic{width:20px; height:20px; flex-shrink:0; fill:none; stroke:currentColor; display:inline-block; vertical-align:middle;}
.ic.lg{width:24px; height:24px;}
/* Height and bottom padding per variant */
html[data-bar="1"] .tabbar{height:calc(56px + env(safe-area-inset-bottom)); padding:0 0 env(safe-area-inset-bottom);}
html[data-bar="2"] .tabbar{height:calc(52px + max(env(safe-area-inset-bottom) - 8px, 6px)); padding:0 0 max(env(safe-area-inset-bottom) - 8px, 6px);}
html[data-bar="3"] .tabbar{height:calc(48px + max(env(safe-area-inset-bottom) - 14px, 6px)); padding:0 0 max(env(safe-area-inset-bottom) - 14px, 6px);}
</style>
</head>
<body>
<div id="root">
  <div class="row" id="fixRow">
    <a class="pill" href="diag.html?fix=0" data-fix="0">fix 0</a>
    <a class="pill" href="diag.html?fix=1" data-fix="1">fix 1</a>
    <a class="pill" href="diag.html?fix=2" data-fix="2">fix 2</a>
    <a class="pill" href="diag.html?fix=3" data-fix="3">fix 3</a>
    <button class="pill go" id="btnReload" type="button">Оновити</button>
  </div>
  <div class="row" id="barRow">
    <span class="lbl">Панель</span>
    <button class="pill active" type="button" data-bar="1">1</button>
    <button class="pill" type="button" data-bar="2">2</button>
    <button class="pill" type="button" data-bar="3">3</button>
  </div>
  <div class="hint">diag-2: скрін → кроки з чату → Копіювати</div>
  <table>
    <tr><td class="k">build</td><td id="v-build"></td></tr>
    <tr><td class="k">mode</td><td id="v-mode"></td></tr>
    <tr><td class="k">ua</td><td id="v-ua"></td></tr>
    <tr><td class="k">dpr</td><td id="v-dpr"></td></tr>
    <tr><td class="k">screen</td><td id="v-screen"></td></tr>
    <tr><td class="k">inner</td><td id="v-inner"></td></tr>
    <tr><td class="k">docEl</td><td id="v-docEl"></td></tr>
    <tr><td class="k">body</td><td id="v-body"></td></tr>
    <tr><td class="k">vv</td><td id="v-vv"></td></tr>
    <tr><td class="k">fixed</td><td id="v-fixed"></td></tr>
    <tr><td class="k">units</td><td id="v-units"></td></tr>
    <tr><td class="k">env</td><td id="v-env"></td></tr>
    <tr><td class="k">orient</td><td id="v-orient"></td></tr>
    <tr><td class="k">fix</td><td id="v-fix"></td></tr>
    <tr class="wrap"><td class="k">html</td><td id="v-html"></td></tr>
    <tr><td class="k">scroll</td><td id="v-scroll"></td></tr>
    <tr><td class="k">marker</td><td id="v-marker"></td></tr>
    <tr><td class="k">bar</td><td id="v-bar"></td></tr>
  </table>
  <div class="ctl">
    <input id="inp" type="text" inputmode="decimal" placeholder="1" aria-label="Поле вводу">
    <button id="btnCopy" type="button">Копіювати</button>
    <span id="copyMsg"></span>
  </div>
  <div id="log"></div>
</div>

<!-- Hidden probes -->
<div class="probe" id="p-vh"></div>
<div class="probe" id="p-dvh"></div>
<div class="probe" id="p-svh"></div>
<div class="probe" id="p-lvh"></div>
<div id="p-fixed"></div>
<div id="p-env"></div>

<!-- Marker on the physical bottom edge -->
<div id="marker"></div>

<!-- Tab bar mock: icons inlined from the sprite in index.html -->
<nav class="tabbar" id="tabbar">
  <button class="tab-btn active" type="button" data-tab="1"><svg class="ic lg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12c2 -2.96 0 -7 -1 -8c0 3.038 -1.773 4.741 -3 6c-1.226 1.26 -2 3.24 -2 5a6 6 0 1 0 12 0c0 -1.532 -1.056 -3.94 -2 -5c-1.786 3 -2.791 3 -4 2z"/></svg><span>Сьогодні</span></button>
  <button class="tab-btn" type="button" data-tab="2"><svg class="ic lg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19l16 0"/><path d="M4 15l4 -6l4 2l4 -5l4 4"/></svg><span>Прогрес</span></button>
  <button class="tab-btn" type="button" data-tab="3"><svg class="ic lg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.875 12c.621 0 1.125 .512 1.125 1.143v5.714c0 .631 -.504 1.143 -1.125 1.143h-15.875a1 1 0 0 1 -1 -1v-5.857c0 -.631 .504 -1.143 1.125 -1.143h15.75z"/><path d="M9 12v2"/><path d="M6 12v3"/><path d="M12 12v3"/><path d="M18 12v3"/><path d="M15 12v2"/><path d="M3 3v4"/><path d="M3 5h18"/><path d="M21 3v4"/></svg><span>Тіло</span></button>
  <button class="tab-btn" type="button" data-tab="4"><svg class="ic lg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0"/><path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0"/><path d="M3 6l0 13"/><path d="M12 6l0 13"/><path d="M21 6l0 13"/></svg><span>Довідка</span></button>
</nav>

<script>
(function () {
  "use strict";

  var BUILD = "diag-2";
  var LOG_MAX = 40;
  var FIX = String(window.__diagFix || "1");
  var BAR = "1";

  var $ = function (id) { return document.getElementById(id); };
  var logLines = [];
  var loadTime = "";

  /* ---------- helpers ---------- */

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function hms(d) { return pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds()); }

  // undefined / null / NaN -> "n/a"; everything else as a string
  function na(v) {
    if (v === undefined || v === null) return "n/a";
    if (typeof v === "number" && isNaN(v)) return "n/a";
    return String(v);
  }

  // number rounded to one decimal, or "n/a"
  function r1(v) {
    if (typeof v === "string") v = parseFloat(v);
    if (typeof v !== "number" || isNaN(v)) return "n/a";
    return String(Math.round(v * 10) / 10);
  }

  function mm(q) {
    try { return window.matchMedia ? String(window.matchMedia(q).matches) : "n/a"; }
    catch (e) { return "n/a"; }
  }

  function setText(id, text) { $(id).textContent = text; }

  /* ---------- individual measurements ---------- */

  function uaShort() {
    var ua = (navigator.userAgent || "");
    var os = /OS (\d+)[_.](\d+)/.exec(ua);
    var saf = /Version\/(\d+(\.\d+)?)/.exec(ua);
    var osStr = os ? "iOS " + os[1] + "." + os[2] : "iOS n/a";
    var safStr = saf ? "Safari " + saf[1] : "Safari n/a";
    return osStr + " / " + safStr;
  }

  // true when the browser supports the given CSS value (unknown -> assume yes)
  function supports(prop, value) {
    try { return (window.CSS && CSS.supports) ? CSS.supports(prop, value) : true; }
    catch (e) { return true; }
  }

  function envInsets() {
    if (!supports("padding-top", "env(safe-area-inset-top)")) return { t: "n/a", r: "n/a", b: "n/a", l: "n/a" };
    var cs = getComputedStyle($("p-env"));
    return {
      t: r1(cs.paddingTop), r: r1(cs.paddingRight),
      b: r1(cs.paddingBottom), l: r1(cs.paddingLeft)
    };
  }

  function fixedRect() { return $("p-fixed").getBoundingClientRect(); }

  // height of a unit probe, or "n/a" when the unit is unsupported
  function probeH(id, unit) {
    if (unit && !supports("height", "100" + unit)) return "n/a";
    return r1($(id).getBoundingClientRect().height);
  }

  function vvInfo() {
    var vv = window.visualViewport;
    if (!vv) return null;
    return { w: vv.width, h: vv.height, top: vv.offsetTop, pageTop: vv.pageTop, scale: vv.scale };
  }

  function orientInfo() {
    var so = screen.orientation;
    return {
      type: so ? na(so.type) : "n/a",
      angle: so ? r1(so.angle) : (typeof window.orientation === "number" ? r1(window.orientation) : "n/a"),
      portrait: mm("(orientation: portrait)")
    };
  }

  // fix row: the variant, plus "off: not standalone" when it cannot apply
  function fixRow() {
    if (FIX === "0") return "0";
    var on = (FIX === "3")
      ? (navigator.standalone === true)
      : (mm("(display-mode: standalone)") === "true");
    return FIX + (on ? "" : " off: not standalone");
  }

  // html row: offsetHeight and the computed min-height string as is
  function htmlRow() {
    var de = document.documentElement;
    var mh = "";
    try { mh = getComputedStyle(de).minHeight; } catch (e) { mh = ""; }
    return "offsetH " + r1(de.offsetHeight) + " min-height " + (mh === "" || mh === undefined || mh === null ? "n/a" : mh);
  }

  function scrollRow() {
    var de = document.documentElement;
    return "y " + r1(window.scrollY) + " extra " + r1(de.scrollHeight - window.innerHeight);
  }

  function markerRow() {
    return "bottom " + r1($("marker").getBoundingClientRect().bottom);
  }

  // bar row: variant, total height, row height (total minus bottom padding), top edge
  function barRow() {
    var el = $("tabbar");
    var rc = el.getBoundingClientRect();
    var pb = parseFloat(getComputedStyle(el).paddingBottom);
    if (isNaN(pb)) pb = 0;
    return "v" + BAR + " total " + r1(rc.height) + " row " + r1(rc.height - pb) + " top " + r1(rc.top);
  }

  /* ---------- table ---------- */

  function fillTable() {
    var de = document.documentElement;
    var b = document.body;
    var vv = vvInfo();
    var fr = fixedRect();
    var env = envInsets();
    var o = orientInfo();

    setText("v-build", BUILD + " " + loadTime);
    setText("v-mode", "standalone=" + na(navigator.standalone) + " display-mode=" + mm("(display-mode: standalone)"));
    setText("v-ua", uaShort());
    setText("v-dpr", r1(window.devicePixelRatio));
    setText("v-screen", r1(screen.width) + "×" + r1(screen.height) + " avail " + r1(screen.availWidth) + "×" + r1(screen.availHeight));
    setText("v-inner", r1(window.innerWidth) + "×" + r1(window.innerHeight) + " outer " + r1(window.outerWidth) + "×" + r1(window.outerHeight));
    setText("v-docEl", r1(de.clientWidth) + "×" + r1(de.clientHeight) + " scroll " + r1(de.scrollHeight));
    setText("v-body", b ? r1(b.clientWidth) + "×" + r1(b.clientHeight) : "n/a");
    setText("v-vv", vv
      ? r1(vv.w) + "×" + r1(vv.h) + " top " + r1(vv.top) + " pageTop " + r1(vv.pageTop) + " scale " + r1(vv.scale)
      : "n/a");
    setText("v-fixed", "top " + r1(fr.top) + " bottom " + r1(fr.bottom) + " h " + r1(fr.height));
    setText("v-units", "vh " + probeH("p-vh", "vh") + " dvh " + probeH("p-dvh", "dvh") + " svh " + probeH("p-svh", "svh") + " lvh " + probeH("p-lvh", "lvh"));
    setText("v-env", "t " + env.t + " r " + env.r + " b " + env.b + " l " + env.l);
    setText("v-orient", o.type + " " + o.angle + " portrait=" + o.portrait);
    setText("v-fix", fixRow());
    setText("v-html", htmlRow());
    setText("v-scroll", scrollRow());
    setText("v-marker", markerRow());
    setText("v-bar", barRow());
  }

  /* ---------- log (last 40 events, newest first) ---------- */

  function addLog(name) {
    var vv = vvInfo();
    var fr = fixedRect();
    var o = orientInfo();
    var line = hms(new Date()) + " " + name +
      " innerH=" + r1(window.innerHeight) +
      " vvH=" + (vv ? r1(vv.h) : "n/a") +
      " vvTop=" + (vv ? r1(vv.top) : "n/a") +
      " fixedH=" + r1(fr.height) +
      " htmlH=" + r1(document.documentElement.offsetHeight) +
      " scrollY=" + r1(window.scrollY) +
      " angle=" + o.angle;
    logLines.unshift(line);
    if (logLines.length > LOG_MAX) logLines.length = LOG_MAX;
    var box = $("log");
    box.textContent = "";
    for (var i = 0; i < logLines.length; i++) {
      var d = document.createElement("div");
      d.textContent = logLines[i];
      box.appendChild(d);
    }
  }

  // One refresh = fill the table, append to the log
  function refresh(eventName) {
    fillTable();
    addLog(eventName);
  }

  // Re-apply fix 3 (no-op unless fix is 3 and standalone), then refresh
  function reapplyAndRefresh(eventName) {
    try { if (typeof window.__diagApplyFix3 === "function") window.__diagApplyFix3(); } catch (e) {}
    refresh(eventName);
  }

  /* ---------- controls ---------- */

  function tableAsText() {
    var rows = document.querySelectorAll("table tr");
    var out = [];
    for (var i = 0; i < rows.length; i++) {
      var cells = rows[i].children;
      out.push(cells[0].textContent + ": " + cells[1].textContent);
    }
    return out.join("\n");
  }

  function showCopyMsg(ok) {
    setText("copyMsg", ok ? "скопійовано" : "не вдалось");
  }

  function doCopy() {
    var text = tableAsText() + "\n\n" + logLines.join("\n");
    var cb = navigator.clipboard;
    if (!cb || typeof cb.writeText !== "function") {
      showCopyMsg(false);
      refresh("copy");
      return;
    }
    cb.writeText(text).then(function () {
      showCopyMsg(true);
      refresh("copy");
    }, function () {
      showCopyMsg(false);
      refresh("copy");
    });
  }

  function setActive(list, attr, value) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].getAttribute(attr) === value) list[i].classList.add("active");
      else list[i].classList.remove("active");
    }
  }

  function onTabClick(ev) {
    var n = ev.currentTarget.getAttribute("data-tab");
    setActive(document.querySelectorAll("#tabbar .tab-btn"), "data-tab", n);
    refresh("tab " + n);
  }

  function onBarClick(ev) {
    BAR = ev.currentTarget.getAttribute("data-bar");
    document.documentElement.setAttribute("data-bar", BAR);
    setActive(document.querySelectorAll("#barRow .pill"), "data-bar", BAR);
    refresh("bar " + BAR);
  }

  /* ---------- wiring ---------- */

  function init() {
    loadTime = hms(new Date());

    setActive(document.querySelectorAll("#fixRow a"), "data-fix", FIX);
    var attr = document.documentElement.getAttribute("data-bar");
    if (attr === "1" || attr === "2" || attr === "3") BAR = attr;
    setActive(document.querySelectorAll("#barRow .pill"), "data-bar", BAR);

    var tabs = document.querySelectorAll("#tabbar .tab-btn");
    for (var i = 0; i < tabs.length; i++) tabs[i].addEventListener("click", onTabClick);
    var bars = document.querySelectorAll("#barRow .pill");
    for (var j = 0; j < bars.length; j++) bars[j].addEventListener("click", onBarClick);

    $("btnReload").addEventListener("click", function () { location.reload(); });
    $("btnCopy").addEventListener("click", doCopy);

    window.addEventListener("resize", function () { reapplyAndRefresh("resize"); });
    window.addEventListener("orientationchange", function () { reapplyAndRefresh("orientationchange"); });
    window.addEventListener("scroll", function () { refresh("scroll"); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function () { refresh("vv-resize"); });
      window.visualViewport.addEventListener("scroll", function () { refresh("vv-scroll"); });
    }
    document.addEventListener("focusin", function () { refresh("focusin"); });
    document.addEventListener("focusout", function () { refresh("focusout"); });

    // First refresh on the real load event (or at once if it already fired)
    if (document.readyState === "complete") {
      refresh("load");
    } else {
      window.addEventListener("load", function () { refresh("load"); });
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
